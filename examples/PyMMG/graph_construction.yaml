stage: graph_construction
model: PyMMG_GraphBuilder
input_dir: MY_DATA_DIR/feature_store/
stage_dir: MY_DATA_DIR/graphs/

event_prefix: ""
data_split: [0, 10, 0]

module_map_pattern_path: "MODULE_MAP_PATTERN_PATH"

# ModuleMapGraph is CUDA-only and single-GPU. A `devices` list of more than one
# entry falls back to device 0 with a warning.
accelerator: cuda
devices: [0]
nb_blocks: 512
save-graph-on-disk: True
